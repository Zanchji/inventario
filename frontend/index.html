<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Inventario</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    h1 { color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sistema de Gestión de Inventario</h1>
    <p>Frontend con Vanilla JS activo.</p>
    <p id="api-status">Conectando con el servidor...</p>
  </div>

  <script>
    fetch('http://localhost:5000/api')
      .then(res => res.json())
      .then(data => {
        document.getElementById('api-status').innerText = 'Backend: ' + data.message;
      })
      .catch(() => {
        document.getElementById('api-status').innerText = 'Error al conectar con el Backend';
      });
  </script>
</body>
</html>
